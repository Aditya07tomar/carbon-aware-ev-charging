services:
  - type: web
    name: carbon-ev-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WATTTIME_USERNAME
        sync: false
      - key: WATTTIME_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
